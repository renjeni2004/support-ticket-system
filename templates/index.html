
<!DOCTYPE html>
<html>
<head>
<title>SupportDesk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="sidebar">
<h4>SupportDesk</h4>
<a onclick="show('dashboard')">Dashboard</a>
<a onclick="show('new')">New Ticket</a>
<a onclick="show('all')">All Tickets</a>
</div>

<div class="content">

<div id="dashboard">
<h2>Dashboard</h2>
<div class="row">
<div class="col"><div class="card p-3">Total <h3 id="t_total"></h3></div></div>
<div class="col"><div class="card p-3">Open <h3 id="t_open"></h3></div></div>
<div class="col"><div class="card p-3">Critical <h3 id="t_critical"></h3></div></div>
</div>
</div>

<div id="new" style="display:none">
<h2>New Ticket</h2>
<input id="title" class="form-control mb-2" placeholder="Title">
<textarea id="desc" class="form-control mb-2"></textarea>
<select id="cat" class="form-control mb-2">
<option value="general">General</option>
<option value="technical">Technical</option>
<option value="billing">Billing</option>
<option value="account">Account</option>
</select>

<select id="pri" class="form-control mb-2">
<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
<option value="critical">Critical</option>
</select>

<button class="btn btn-primary" onclick="submitTicket()">Submit</button>
</div>

<div id="all" style="display:none">
<h2>All Tickets</h2>
<div id="list"></div>
</div>

</div>

<script src="/static/js/app.js"></script>
</body>
</html>
